name: Daily AIAA Opportunity Scan

on:
  # Lets you run it manually from the Actions tab
  workflow_dispatch:
  pull_request:
    branches: [ main ]

  # Run every day at 9:00 AM Central
  # 14:00 UTC = 9 AM CDT
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  scan-opportunities:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run opportunity finder
        run: python internship_finder.py

      - name: Validate generated outputs
        run: |
          test -s data/jobs.csv
          test -s data/roles.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/roles.json').read_text())
          assert isinstance(p.get('roles'), list)
          print(f"Validated {len(p['roles'])} live roles")
          PY

      - name: Save updated opportunity data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "AIAA Opportunity Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No opportunity changes today."
          else
            git commit -m "Update opportunity listings"
            git push
          fi

      - name: Upload latest opportunity tracker
        uses: actions/upload-artifact@v4
        with:
          name: AIAA-UH-Aerospace-Opportunities
          path: |
            AIAA_UH_Summer_2027_Internships.xlsx
            data/jobs.csv
            data/roles.json
          if-no-files-found: warn
